<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VidyaSetu – Learn. Ask. Grow.</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F6FF;--ink:#171A3A;--mute:#5E648F;--line:rgba(23,26,58,.12);--surf:#fff;--c1:#5B5BD6;--c2:#0F9D8F;--c3:#F0506E;--c4:#FFB020;--c5:#8B5CF6;--disp:'Bricolage Grotesque',system-ui,sans-serif;--body:'Plus Jakarta Sans',system-ui,'Noto Sans Devanagari',sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1126;--ink:#EEF0FF;--mute:#9AA0CC;--line:rgba(238,240,255,.14);--surf:#181C3A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1126;--ink:#EEF0FF;--mute:#9AA0CC;--line:rgba(238,240,255,.14);--surf:#181C3A;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.6 var(--body);overflow-x:hidden}
#app{max-width:44rem;margin:0 auto;padding:1rem 1.1rem 8rem}
h1,h2,h3{font-family:var(--disp);line-height:1.1;margin:0 0 .6rem}
h1{font-size:clamp(2rem,8vw,2.8rem);font-weight:800}h2{font-size:1.7rem;font-weight:800;margin-top:.4rem}h3{font-size:1.15rem;margin:1.6rem 0 .7rem}
.brand{font:800 1.5rem var(--disp);background:linear-gradient(90deg,var(--c1),var(--c3),var(--c4));-webkit-background-clip:text;background-clip:text;color:transparent}
.top{display:flex;justify-content:space-between;align-items:center;gap:.6rem}
.sub{color:var(--mute);margin:.2rem 0 1.2rem}
button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--c1);color:#fff;border:0;border-radius:.9rem;padding:.7rem 1.2rem;font-weight:600;cursor:pointer;transition:transform .12s ease,filter .2s;touch-action:manipulation}
.btn.alt{background:var(--c2)}.btn.hot{background:var(--c3)}.btn.sun{background:var(--c4);color:#2A1C00}
.btn.o{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:active,.card:active,.opt:active,.nv button:active{transform:scale(.96)}
input,textarea,select{width:100%;background:var(--surf);border:1.5px solid var(--line);border-radius:.9rem;padding:.7rem .9rem;margin:0 0 .7rem;outline:0;transition:border-color .2s}
input:focus,textarea:focus,select:focus{border-color:var(--c1)}
textarea{min-height:7rem;resize:vertical}
.panel,.item{background:var(--surf);border:1px solid var(--line);border-radius:1.2rem;padding:1.1rem;margin-bottom:.8rem}
.item p{margin:.3rem 0}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-bottom:.8rem}
.row select{width:auto;margin:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.card{text-align:left;border:0;border-radius:1.4rem;padding:1.1rem;min-height:9.5rem;cursor:pointer;background:color-mix(in srgb,var(--c) 16%,var(--surf));border:1.5px solid color-mix(in srgb,var(--c) 40%,transparent);transition:transform .15s ease;display:flex;flex-direction:column;gap:.3rem}
.card i{font-style:normal;font-size:2rem}.card b{font:800 1.15rem var(--disp)}.card span{font-size:.85rem;color:var(--mute)}
.chip{font-size:.8rem;font-weight:600;border-radius:99px;padding:.15rem .7rem}
.chip.ok{background:color-mix(in srgb,var(--c2) 22%,transparent);color:var(--c2)}.chip.wait{background:color-mix(in srgb,var(--c4) 28%,transparent);color:#9A6700}
.ans{background:color-mix(in srgb,var(--c2) 14%,var(--surf));border-left:4px solid var(--c2);border-radius:.6rem;padding:.6rem .8rem;margin-top:.5rem;white-space:pre-wrap}
.qz{background:var(--surf);border:1px solid var(--line);border-radius:1.2rem;padding:1rem;margin-bottom:.8rem}
.opt{display:block;width:100%;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:.8rem;padding:.6rem .9rem;margin-top:.5rem;cursor:pointer;transition:transform .12s ease,background .25s}
.opt.ok{background:color-mix(in srgb,var(--c2) 28%,var(--surf));border-color:var(--c2)}.opt.no{background:color-mix(in srgb,var(--c3) 25%,var(--surf));border-color:var(--c3)}
.why{display:block;color:var(--mute);margin-top:.5rem}
.score{font:800 1.4rem var(--disp);text-align:center;color:var(--c5)}
.notes{background:var(--surf);border:1px solid var(--line);border-left:5px solid var(--c5);border-radius:1.2rem;padding:1.1rem;white-space:pre-wrap}
.chat{display:flex;flex-direction:column;gap:.6rem;margin-bottom:.9rem;min-height:30vh}
.b{max-width:86%;padding:.7rem 1rem;border-radius:1.2rem;white-space:pre-wrap}
.b.user{align-self:flex-end;background:var(--c1);color:#fff;border-bottom-right-radius:.3rem}
.b.assistant{align-self:flex-start;background:var(--surf);border:1px solid var(--line);border-bottom-left-radius:.3rem}
.send{display:flex;gap:.6rem;align-items:flex-end}.send textarea{min-height:0;height:3rem;margin:0}
.stat{font:800 2.4rem var(--disp);color:var(--c1)}.stat span{font-size:1rem;color:var(--mute);font-weight:500}
.err{color:var(--c3);font-weight:600}.x{background:none;border:0;color:var(--c3);font-weight:600;cursor:pointer}
.sp{display:flex;justify-content:space-between;align-items:center;gap:.6rem}
.login{margin-top:12vh;text-align:center}.login .panel{text-align:left;margin-top:1.4rem}
.nv{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;gap:.2rem;padding:.5rem .6rem calc(.5rem + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--surf) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.nv button{flex:1;max-width:6.5rem;background:none;border:0;border-radius:1rem;padding:.35rem 0;cursor:pointer;display:grid;justify-items:center;font-size:.72rem;color:var(--mute);transition:transform .12s ease,background .25s}
.nv button i{font-style:normal;font-size:1.3rem}
.nv button.on{background:color-mix(in srgb,var(--c1) 16%,transparent);color:var(--ink);font-weight:600}
.pwf{position:relative}.pwf input{padding-right:3rem}.pwf button{position:absolute;right:.4rem;top:.3rem;background:none;border:0;font-size:1.2rem;cursor:pointer;padding:.2rem .5rem}.logo{width:3.6rem;height:3.6rem;display:block;margin:0 auto .4rem}.tabs{display:flex;gap:.3rem;background:var(--bg);border-radius:1rem;padding:.25rem;margin-bottom:1rem}.tabs button{flex:1;border:0;background:none;border-radius:.8rem;padding:.55rem;cursor:pointer;font-weight:600;color:var(--mute);transition:background .2s}.tabs button.on{background:var(--surf);color:var(--ink);box-shadow:0 1px 6px rgba(0,0,0,.14)}.idb{font:800 3.4rem var(--disp);letter-spacing:.22em;color:var(--c1);margin:.4rem 0 .4rem .22em}
.nv button{position:relative}.nv button[data-b]::after{content:attr(data-b);position:absolute;top:0;right:24%;background:var(--c3);color:#fff;font-size:.65rem;font-weight:700;border-radius:99px;min-width:1.1rem;padding:0 .3rem;line-height:1.1rem}.adm .nv button.on{background:color-mix(in srgb,var(--c3) 18%,transparent)}.admbar{background:linear-gradient(90deg,var(--c1),var(--c5));color:#fff;border-radius:1.2rem;padding:.7rem 1rem;margin-bottom:1.2rem}.admbar b{font:800 1.15rem var(--disp)}.gal{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:1rem;display:block}.gal small{color:var(--mute)}
.v{animation:in .3s cubic-bezier(.2,.7,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
footer{text-align:center;color:var(--mute);font-size:.85rem;margin-top:2.5rem}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.rp{position:absolute;width:190px;height:190px;margin:-95px 0 0 -95px;border-radius:50%;opacity:0;animation:rp .75s cubic-bezier(.2,.7,.2,1) forwards;will-change:transform,opacity}
@keyframes rp{from{transform:scale(0);opacity:.55}to{transform:scale(1);opacity:0}}
#toast{position:fixed;left:50%;bottom:6rem;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1.1rem;border-radius:99px;z-index:60;max-width:90vw;text-align:center;animation:in .25s}
@media (prefers-reduced-motion:reduce){.v,.rp,#toast{animation:none}.rp{display:none}}
:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
body{background:radial-gradient(60rem 26rem at 105% -6%,color-mix(in srgb,var(--c5) 18%,transparent),transparent),radial-gradient(50rem 26rem at -10% 22%,color-mix(in srgb,var(--c2) 15%,transparent),transparent),var(--bg);background-attachment:fixed}
h2{background:linear-gradient(90deg,var(--c1),var(--c5) 60%,var(--c3));-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:linear-gradient(145deg,color-mix(in srgb,var(--c) 24%,var(--surf)),var(--surf))}
.rp{width:76px;height:76px;margin:-38px 0 0 -38px}
.top .ib{width:2.6rem;height:2.6rem;border-radius:.9rem;border:1.5px solid var(--line);background:var(--surf);font-size:1.4rem;cursor:pointer;line-height:1;transition:transform .12s}.ib:active{transform:scale(.92)}
.sheet{position:fixed;inset:0;background:rgba(15,18,38,.45);z-index:40;animation:fade .2s}@keyframes fade{from{opacity:0}to{opacity:1}}
.sh{position:absolute;top:calc(env(safe-area-inset-top,0px) + .6rem);background:var(--surf);border-radius:1.4rem;padding:.6rem;width:min(18.5rem,88vw);max-height:82vh;overflow:auto;box-shadow:0 16px 50px rgba(0,0,0,.3);animation:in .25s}.sh.L{left:.7rem}.sh.R{right:.7rem}
.mi{display:flex;align-items:center;gap:.8rem;width:100%;text-align:left;background:none;border:0;border-radius:.9rem;padding:.6rem .7rem;cursor:pointer;font-weight:600;transition:background .2s,transform .12s}.mi:active{transform:scale(.97);background:color-mix(in srgb,var(--c) 18%,transparent)}.mi i{font-style:normal;flex:none;width:2.2rem;height:2.2rem;border-radius:.7rem;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 22%,transparent)}
.pop{position:fixed;inset:0;background:rgba(15,18,38,.55);display:grid;place-items:center;z-index:70;animation:fade .25s}.pc{background:var(--surf);border-radius:1.6rem;padding:1.6rem;text-align:center;width:min(20rem,86vw);box-shadow:0 20px 60px rgba(0,0,0,.35);animation:in .3s}
.op2{display:block;width:100%;text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:.8rem;padding:.6rem .9rem;margin-top:.5rem;cursor:pointer;transition:transform .12s ease,background .25s}.op2:active{transform:scale(.97)}.op2.sel{border-color:var(--c1);background:color-mix(in srgb,var(--c1) 16%,var(--bg))}
.stars{display:flex;gap:.2rem;margin-bottom:.6rem}.stars button{background:none;border:0;font-size:2.5rem;line-height:1;color:var(--line);cursor:pointer;transition:transform .15s,color .2s}.stars button.on{color:var(--c4);transform:scale(1.08)}
.qcard{background:linear-gradient(135deg,var(--c5),var(--c3));color:#fff;border-radius:1.4rem;padding:1.6rem;font:600 1.35rem/1.4 var(--disp);margin:1rem 0;animation:in .3s}
details.item summary{cursor:pointer;list-style:none}
a.mi{color:inherit;text-decoration:none}
label.btn{position:relative;overflow:hidden;display:inline-block}
.drop{display:flex;flex-direction:column;align-items:center;gap:.2rem;width:100%;background:var(--bg);color:inherit;border:2px dashed var(--line);border-radius:1rem;padding:.9rem;margin:.5rem 0 0;font:inherit;font-weight:600;cursor:pointer;transition:border-color .2s,background .2s,transform .12s}.drop small{font-weight:400;opacity:.7}.drop:active{transform:scale(.98)}.drop.over,.drop:focus-visible{border-color:var(--c1);background:color-mix(in srgb,var(--c1) 10%,var(--bg))}
.thumbs{display:flex;flex-wrap:wrap;gap:.5rem;margin:.5rem 0}.thumbs:empty{display:none}.th{position:relative;width:4.8rem;height:4.8rem;padding:0;border-radius:.8rem;overflow:hidden;border:2px solid var(--line);background:var(--bg)}.th img{width:100%;height:100%;object-fit:cover;display:block}.th .x2{position:absolute;top:.15rem;right:.15rem;width:1.5rem;height:1.5rem;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:.8rem;line-height:1;cursor:pointer}.th.pg{cursor:pointer}.th.pg small{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:.7rem;text-align:center}.th.sel{border-color:var(--c1);box-shadow:0 0 0 2px var(--c1)}.th.sel::after{content:'✓';position:absolute;top:.15rem;right:.15rem;width:1.4rem;height:1.4rem;border-radius:50%;background:var(--c1);color:#fff;display:grid;place-items:center;font-size:.8rem}
label.btn input[type=file]{display:block!important;position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;padding:0;border:0;cursor:pointer;font-size:0}
.drop{position:relative;overflow:hidden}.ovr{position:absolute;inset:0;width:100%;height:100%;max-width:none;opacity:0;cursor:pointer;font-size:0;margin:0;padding:0;border:0;z-index:2}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
<div id="app"></div><div id="fx"></div>
<script>
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
let db=null,sample=null,owner=false;
const LS={get:k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const mem=LS.get('vs_mem')||{users:{},doubts:{},msgs:{}};
const S={me:null,tab:'home',text:'',img:null,out:'',chat:[],score:0};
const ls=async c=>db?(await db.collection(c).get()).docs.map(d=>({id:d.id,...d.data()})):Object.entries(mem[c]).map(([id,v])=>({id,...v}));
const put=async(c,id,v)=>db?db.doc(c+'/'+id).set(v):void(mem[c][id]=v,LS.set('vs_mem',mem));
const rm=async(c,id)=>db?db.doc(c+'/'+id).delete():void(delete mem[c][id],LS.set('vs_mem',mem));
const toast=(m,ms=3200)=>{$('#toast')?.remove();const t=document.createElement('div');t.id='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),ms)};
const COL=['#5B5BD6','#0F9D8F','#F0506E','#FFB020','#8B5CF6'];
document.addEventListener('pointerdown',e=>{const r=document.createElement('div');r.className='rp';r.style.cssText=`left:${e.clientX}px;top:${e.clientY}px;background:${COL[Math.random()*5|0]}`;$('#fx').append(r);r.onanimationend=()=>r.remove()},{passive:true});
const foot='<footer>Copyright © 2026 Vivek Singh. All rights reserved.<br>Made with faith &amp; love by Vivek Singh, for every curious learner ✨</footer>';
const SYS='You are Gyani Baba, the friendly AI helper of the VidyaSetu study website. Answer any question the student asks (studies, general knowledge, careers, coding, life) directly and correctly, and never mention any other product or company name. Reply in the same language the student uses (Hindi, English or Hinglish). Explain step by step in simple words with a small example. Plain text only, no markdown symbols. If unsure, say so.';

function login(){
 $('#app').innerHTML=`<div class="login v"><div class="brand" style="font-size:2.6rem">VidyaSetu</div><p class="sub">Learn. Ask. Grow.</p>
 <div class="panel"><h3 style="margin-top:0">Sign in</h3><input id="lu" placeholder="Username" autocapitalize="none" autocomplete="username"><input id="lp" type="password" placeholder="Password" autocomplete="current-password"><button class="btn" style="width:100%" data-a="login">Sign in</button>
 ${(owner||!db)?'<h3>Admin portal</h3><input id="adp" type="password" placeholder="Admin password" autocomplete="off"><button class="btn hot" style="width:100%" data-a="admin">Enter as Admin</button>':''}</div>
 <p class="sub">Your ID and password are given by your admin.${db?'':' (Preview mode: data is not saved.)'}</p>${foot}</div>`;
}
let lt='in';
const LOGO='<svg class="logo" viewBox="0 0 64 64" role="img" aria-label="VidyaSetu logo"><rect width="64" height="64" rx="16" fill="#5B5BD6"/><path d="M12 46c6-4 13-4 20 0 7-4 14-4 20 0V27c-6-4-13-4-20 0-7-4-14-4-20 0z" fill="#fff"/><path d="M32 27v19" stroke="#5B5BD6" stroke-width="2.5"/><path d="M13 23c6-10 32-10 38 0" fill="none" stroke="#FFB020" stroke-width="4.5" stroke-linecap="round"/></svg>';
const pw=(id,ph)=>`<div class="pwf"><input id="${id}" type="password" placeholder="${ph}" autocomplete="off"><button type="button" data-eye="${id}" aria-label="Show or hide password">👁️</button></div>`;
const persist=()=>{if(S.me&&S.me.role==='student')LS.set('vs_d_'+S.me.u,{text:S.text,out:S.out,chat:S.chat.slice(-40)})};
function enter(me){S.me=me;S.tab=me.role==='admin'?'admin':'home';if(me.role==='student'){LS.set('vs_s',me);visit(me);const d=LS.get('vs_d_'+me.u)||{};S.text=d.text||'';S.out=d.out||'';S.chat=d.chat||[];toast('Hi '+me.n+'! 👋')}shell()}
function welcome(me){S.pend=me;$('#app').innerHTML=`<div class="login v">${LOGO}<h1>Welcome, ${esc(me.n)}! 🎉</h1><p class="sub">Your unique ID is</p><div class="idb">${esc(me.u)}</div><p class="sub">Save this ID. You need it with your password every time you sign in.</p><button class="btn" data-a="go">Start learning</button>${foot}</div>`}
function login(){const a=lt==='in';$('#app').innerHTML=`<div class="login v">${LOGO}<div class="brand" style="font-size:2.6rem">VidyaSetu</div><p class="sub">Learn. Ask. Grow.</p><div class="panel"><div class="tabs"><button class="${a?'on':''}" data-lt="in">Sign in</button><button class="${a?'':'on'}" data-lt="up">Create account</button></div>${a?`<input id="lu" placeholder="Your ID (e.g. K7P)" autocapitalize="characters" maxlength="3" autocomplete="off">${pw('lp','Password')}<button class="btn" style="width:100%" data-a="login">Sign in</button>`:`<input id="sn" placeholder="Your name" autocomplete="name">${pw('sp','Create a password (min 4)')}<button class="btn alt" style="width:100%" data-a="signup">Create my account</button><p class="sub" style="margin:.7rem 0 0">You’ll get a unique 3-character ID. Remember it to sign in.</p>`}${(owner||!db)?`<h3>Admin portal</h3>${pw('adp','Admin password')}<button class="btn hot" style="width:100%" data-a="admin">Enter as Admin</button>`:''}</div>${foot}</div>`}
function shell(){
 const T=[['home','🏠','Home'],['study','📚','Study'],['tutor','🤖','Tutor'],['doubts','❓','Doubts'],['contact','✉️','Contact']];
 if(S.me.role==='admin')T.push(['admin','🛡️','Admin']);
 $('#app').innerHTML=`<div class="top"><span style="display:flex;align-items:center;gap:.6rem">${LOGO.replace('class="logo"','class="logo" style="width:2.3rem;height:2.3rem;margin:0"')}<span class="brand">VidyaSetu</span></span><button class="btn o" data-a="out">Log out</button></div><main id="v"></main>${foot}<nav class="nv">${T.map(t=>`<button data-go="${t[0]}"><i>${t[1]}</i>${t[2]}</button>`).join('')}</nav>`;
 go(S.tab);
}
async function go(t){persist();badge();
 S.tab=t;document.querySelectorAll('.nv button').forEach(b=>b.classList.toggle('on',b.dataset.go===t));
 $('#v').innerHTML='<div class="v">'+await V[t]()+'</div>';scrollTo({top:0});
}
const quizHTML=q=>q.map((x,i)=>`<div class="qz" data-i="${i}"><b>${i+1}. ${esc(x.q)}</b>${x.o.map((o,j)=>`<button class="opt" data-q="${i}" data-o="${j}" data-a="${x.a}">${esc(o)}</button>`).join('')}<small class="why" data-w="${esc(x.w)}"></small></div>`).join('')+'<div id="score" class="score"></div>';
const V={
 home:async()=>`<h1>Hi ${esc(S.me.n)} 👋</h1><p class="sub">${S.me.role==='student'?'Your ID: <b>'+esc(S.me.u)+'</b> · ':''}What do you want to learn today?</p><div class="grid">${[['study','📚','Quiz & Notes','Add a book page, get a quiz and short notes','--c1'],['tutor','🤖','AI Tutor','Chat and clear your doubts instantly','--c2'],['doubts','❓','My Doubts','Ask your teacher and see the answer','--c3'],['contact','✉️','Contact Admin','Send a message to the admin','--c4']].map(c=>`<button class="card" data-go="${c[0]}" style="--c:var(${c[4]})"><i>${c[1]}</i><b>${c[2]}</b><span>${c[3]}</span></button>`).join('')}</div>`,
 study:async()=>`<h2>Study Studio</h2><p class="sub">Paste text from your book, or add a photo of the page.</p><textarea id="tx" placeholder="Paste a page or chapter here…">${esc(S.text)}</textarea>

async function gen(kind){
 if(!sample)return toast('Gyani Baba is resting for a moment. Please try again shortly.');

 const out=$('#out'),src=S.text?'MATERIAL:\n'+S.text:'Use the attached page photo as the material.',o=S.img?{images:[S.img]}:{};
 out.innerHTML='<p class="sub">Thinking…</p>';
 try{
  if(kind==='quiz'){const q=await sample.json(`Make ${$('#nq').value} multiple-choice questions for school students from the material. Return ONLY a JSON array like [{"q":"question","o":["A","B","C","D"],"a":0,"w":"one-line reason"}] where a is the index of the right option. Use the material's language.\n\n${src}`,o);S.score=0;out.innerHTML=quizHTML(q)}
  else{out.innerHTML='<div class="notes" id="nt"></div>';await sample(`Write short revision notes from the material for a school student: key points as short lines starting with "• ", then 3 important terms with meanings, then a 2-line summary. Plain text, no markdown. Use the material's language.\n\n${src}`,{...o,onText:u=>$('#nt').textContent=u.text})}

 if(a==='signup'){const n=$('#sn').value.trim(),p=$('#sp').value;if(!n||p.length<4)return toast('Enter your name and a password of 4+ characters.');const us=await ls('users');if(us.length>=100)return toast('This space is full (100 students). Please ask your admin.');const ids=new Set(us.map(x=>x.u)),A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let u;do{u=Array.from({length:3},()=>A[Math.random()*A.length|0]).join('')}while(ids.has(u));await put('users',u,{u,n,h:await sha(u+':'+p),t:Date.now()});welcome({u,n,role:'student'})}

/* ===== Standalone mode: free AI (Gemini through a Netlify function) + simple name/section login ===== */
/* ===== AI SETUP: paste your free Gemini key between the quotes (get it at aistudio.google.com/apikey). Leave empty to use the Netlify function instead. ===== */
const GEMINI_KEY='';
const GEMINI_MODELS=['gemini-2.5-flash-lite','gemini-2.5-flash'];
async function geminiDirect(messages,images,json){const contents=messages.slice(-12).map(m=>({role:m.role==='assistant'?'model':'user',parts:[{text:String(m.content||'.').slice(0,24000)}]}));images.forEach(d=>contents[contents.length-1].parts.push({inlineData:{mimeType:'image/jpeg',data:d}}));const gc={maxOutputTokens:4096,temperature:.7};if(json)gc.responseMimeType='application/json';let st=0;for(const m of GEMINI_MODELS){try{const r=await tfetch('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':GEMINI_KEY},body:JSON.stringify({contents,generationConfig:gc})});st=r.status;if(r.ok){const d=await r.json(),t=((d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts)||[]).map(p=>p.text||'').join('').trim();if(t)return t;continue}if([429,500,503,404,400].includes(st))continue;break}catch(e){st=0}}throw Object.assign(new Error('AI busy'),{code:st===429?'busy':'unavailable'})}
const AI_URL='/.netlify/functions/ai';
const shrink=b=>new Promise((ok,no)=>{const im=new Image(),r=new FileReader();r.onerror=no;im.onerror=no;im.onload=()=>{const k=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,im.width*k|0);c.height=Math.max(1,im.height*k|0);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.8).split(',')[1])};r.onload=()=>{im.src=r.result};r.readAsDataURL(b)});
const tfetch=(u,o)=>{const c=new AbortController();setTimeout(()=>c.abort(),45000);return fetch(u,{...o,signal:c.signal})};
let fnDead=false;
const UM={busy:'Gyani Baba is busy right now. Please try again in a minute.',offline:'No internet connection. Please check it and try again.',none:'Gyani Baba is not connected to the AI yet. Please tell your admin.'};
async function pollDirect(messages,images,json){const ms=messages.slice(-12).map(m=>({role:m.role==='assistant'?'assistant':'user',content:String(m.content||'.').slice(0,12000)}));if(images.length){const l=ms[ms.length-1];l.content=[{type:'text',text:l.content},...images.map(d=>({type:'image_url',image_url:{url:'data:image/jpeg;base64,'+d}}))]}const r=await tfetch('https://text.pollinations.ai/openai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'openai',messages:ms,private:true,referrer:location.hostname||'vidyasetu'})});if(!r.ok)throw Object.assign(new Error('AI busy'),{code:r.status===429?'busy':'unavailable'});const d=await r.json(),t=((d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)||'').trim();if(!t)throw Object.assign(new Error('empty'),{code:'unavailable'});return t}
async function aiCall(input,o={}){const messages=typeof input==='string'?[{role:'user',content:input}]:input,images=[];for(const b of(o.images||[]).slice(0,3))images.push(await shrink(b));let code='none';const note=e=>{if(e&&e.code==='busy')code='busy'};
 if(GEMINI_KEY){try{return await geminiDirect(messages,images,!!o.json)}catch(e){note(e)}}
 else if(!fnDead){try{const r=await tfetch(AI_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages,images,json:!!o.json})}),j=await r.json().catch(()=>({}));if(r.ok&&j.text)return j.text;if(r.status===404||j.code==='no_key'||r.status===405)fnDead=true;else note(j)}catch(e){fnDead=true}}
 try{return await pollDirect(messages,images,!!o.json)}catch(e){note(e)}
 if(navigator.onLine===false)code='offline';throw Object.assign(new Error('AI unavailable'),{code,userMsg:UM[code]})}
const aiShim=async(input,o={})=>{const text=await aiCall(input,o);if(o.onText)o.onText({text,delta:text});return{text,truncated:false}};
aiShim.json=async(input,o={})=>{const t=(await aiCall(input,{...o,json:true})).trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();try{return JSON.parse(t)}catch(e){const a=t.search(/[\[{]/),z=Math.max(t.lastIndexOf(']'),t.lastIndexOf('}'));return JSON.parse(t.slice(a,z+1))}};
aiShim.limits=async()=>({images:true});

async function signup(){const n=$('#sn').value.trim().split(/ +/).join(' ').toUpperCase(),sec=$('#ss').value,core=n.split(' ').join('');if(!/^[A-Z ]+$/.test(n)||core.length<3)return toast('Write your full name in English capital letters.');if(!sec)return toast('Select your section (A to E).');const us=await ls('users');let r=us.find(x=>x.n===n&&x.sec===sec);if(!r){if(us.length>=100)return toast('This space is full (100 students). Please ask your admin.');const ids=new Set(us.map(x=>x.u)),base=core.slice(0,3)+sec;let u=base,k=2;while(ids.has(u))u=base+(k++);r={u,n,sec,t:Date.now()};await put('users',u,r)}LS.set('vs_last',{n,sec});enter({u:r.u,n:r.n,sec:r.sec||r.u.slice(3,4),role:'student'})}
{const _h3=V.home;V.home=async()=>(await _h3()).replace("<p class='sub' style='margin:.3rem 0 0'>Your password was set by the admin.</p>",`<div class='sp'><span>Section</span><b>${esc(S.me.sec||S.me.u.slice(3,4))}</b></div>`).replace('Your login details · keep them safe','Your details')}
{const _u3=V.aUsers;V.aUsers=async()=>(await _u3()).replace(/<button class="x" data-rs="[^"]*">Reset password<\/button> ?/g,'')}
sample=aiShim;
(async()=>{
